services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tuvidmt-backend:${TAG:-latest}
    container_name: tuvi-backend
    ports:
      - "${HOST_PORT:-8000}:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
